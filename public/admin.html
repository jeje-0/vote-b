<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 제22차 IVF 정기총회 투표 집계</title>
<style>
  :root{
    --green: #2a6e47;
    --green-deep: #1e5636;
    --green-light: #a7d3b6;
    --pink: #e896c3;
    --yellow: #f2e14d;
    --cream: #faf6ee;
    --ink: #1f2d24;
    --line: #d8d0c0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  .wrap{max-width:1600px;margin:0 auto;padding:20px 24px 32px;}
  h1{font-size:19px;font-weight:800;color:var(--green-deep);margin:0 0 2px;}
  .sub{font-size:12px;color:#5b6b60;margin:0 0 14px;}

  .login-box{max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;}
  .login-box label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
  .login-box input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;}
  .login-box button{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;
    background:var(--green);color:#fff;font-size:15px;font-weight:800;cursor:pointer;}
  .err{color:#c0304a;font-size:13px;margin-top:10px;}

  #resultsView{display:none;}

  .stat-row{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .stat-row .num{font-size:24px;font-weight:800;color:var(--green-deep);}
  .stat-row .num small{font-size:13px;color:#8b9a90;}
  .bar-track{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:18px;max-width:400px;}
  .bar-fill{height:100%;background:var(--green);border-radius:999px;transition:width .4s ease;}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;}
  table{border-collapse:collapse;width:100%;min-width:820px;}
  th, td{text-align:center;padding:10px 8px;font-size:14px;border:1px solid var(--line);white-space:nowrap;}

  thead th.group-head{background:#f1ede3;color:var(--green-deep);font-weight:800;font-size:14px;}
  thead th.cand-head{background:#e7e2d4;color:var(--green-deep);font-weight:800;font-size:15px;}
  thead th.choice-head{font-weight:800;font-size:12px;}
  thead th.choice-yes{background:var(--green-light);color:var(--green-deep);}
  thead th.choice-no{background:var(--yellow);color:#5c5300;}
  thead th.choice-abstain{background:var(--pink);color:#7a2a52;}
  thead th.summary-head{background:#fbf7c4;color:var(--green-deep);font-weight:800;font-size:12px;}
  thead th.total-group{background:#e0dccb;}

  tbody td.cand-name{background:#eee9dc;font-weight:800;font-size:15px;color:var(--ink);}
  tbody td.cell-yes{background:#eef6f0;}
  tbody td.cell-no{background:#fdfbe6;}
  tbody td.cell-abstain{background:#fdeef6;}
  tbody td.total-cell{font-weight:800;}
  tbody tr.group-total-row td{background:#e7e2d4;font-weight:800;border-top:2px solid var(--green-deep);}
  tbody tr:nth-child(even) td:not(.cand-name){background-color:rgba(0,0,0,0.015);}


  /* ---- 재적 입력 / 발표 화면 ---- */
  thead th.summary-head b{font-size:1.15em;}
  thead th.summary-head.over{background:#f7c9c9;color:#8a1f1f;}
  .enrolled-input{width:64px;padding:4px 6px;margin:0 2px;border:2px solid var(--green);border-radius:8px;
    font:inherit;font-weight:800;text-align:center;background:#fff;color:var(--green-deep);}
  .enrolled-text{display:none;}
  tbody td.cell-yes,tbody td.cell-no{font-size:1.25em;font-weight:700;}
  .top-actions{display:flex;justify-content:flex-end;margin-bottom:8px;}
  #presentBtn{padding:8px 16px;border:1px solid var(--green);border-radius:10px;background:#fff;color:var(--green-deep);font-weight:800;font-size:13px;cursor:pointer;}

  body.presenting .enrolled-input{display:none;}
  body.presenting .enrolled-text{display:inline;}
  body.presenting .bar-track,body.presenting .stat-row,body.presenting .sub{display:none;}
  body.presenting #presentBtn{opacity:.25;}
  body.presenting .wrap{max-width:none;padding:24px 40px;}
  body.presenting th,body.presenting td{font-size:clamp(20px,2.2vw,34px);padding:clamp(14px,2.4vh,32px) 10px;}
  body.presenting thead th.choice-head{font-size:clamp(16px,1.8vw,28px);}
  body.presenting tbody td.cand-name{font-size:clamp(24px,2.8vw,42px);}
  body.presenting tbody td.cell-yes,body.presenting tbody td.cell-no{font-size:clamp(28px,3.4vw,52px);}

  /* 넓은 화면(16:9 등)에서는 표가 한 화면에 넉넉히 들어가도록 글자와 여백을 키움 */
  @media (min-width: 1100px){
    .wrap{padding:28px 40px 40px;}
    h1{font-size:22px;}
    .sub{margin-bottom:18px;}
    th, td{padding:14px 14px;font-size:17px;}
    thead th.cand-head{font-size:18px;}
    thead th.summary-head{font-size:14px;}
    tbody td.cand-name{font-size:18px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>관리자 - 실시간 투표 집계</h1>
  <p class="sub">제22차 IVF 정기총회 법인이사 선출투표</p>

  <div id="loginView" class="login-box">
    <label>관리자 비밀번호</label>
    <input type="password" id="adminKeyInput" placeholder="비밀번호 입력">
    <button id="loginBtn">확인</button>
    <div class="err" id="loginErr" style="display:none;"></div>
  </div>

  <div id="resultsView">
    <div class="top-actions"><button id="presentBtn" type="button">발표 화면</button></div>
    <div class="stat-row">
      <div class="num"><span id="voteCount">0</span><small> / <span id="totalTarget">75</span>명 참여</small></div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="table-wrap">
      <table id="resultsTable"></table>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
